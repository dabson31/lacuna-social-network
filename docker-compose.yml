services:
  backend:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    ports:
      - "8080:8080" # host:container
    environment:
      APP_ENV: development
      PORT: "8080"
      DB_PATH: /app/data/social.db
      MIGRATIONS_PATH: /app/migrations
      UPLOAD_DIR: /app/data/uploads
      SESSION_TTL: 168h
      ALLOWED_ORIGIN: http://localhost:3000
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        #! inlined into the browser bundle at build time, so it has to be the url the reader's
        #! browser can reach. code running INSIDE this container would use http://backend:8080,
        #! but none of this app's fetching does — it all happens in the browser
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000" # host:container
    depends_on:
      - backend

volumes:
  backend-data:
